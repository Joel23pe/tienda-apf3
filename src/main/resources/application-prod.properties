# PostgreSQL (producción). Los valores vienen de variables de entorno;
# si no existen, usa la base local para poder probar en tu PC.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tienda}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
# Valor por defecto solo para PostgreSQL local; en Render se define DB_PASSWORD
spring.datasource.password=${DB_PASSWORD:admin}
 
# Render asigna el puerto en la variable PORT
server.port=${PORT:8080}
 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
 
# Clave JWT en Base64 (mínimo 256 bits). El valor por defecto es solo para pruebas locales;
# en Render se define JWT_SECRET con una clave propia.
app.jwt.secret=${JWT_SECRET:Y2xhdmVTZWNyZXRhU3VwZXJTZWd1cmFQYXJhTWlUaWVuZGFKd3QyMDI2TG9jYWwhIQ==}



