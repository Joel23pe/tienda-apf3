<div class="cabecera">
  <h2>Productos</h2>
  <a class="btn" routerLink="/productos/nuevo">Nuevo producto</a>
</div>

<app-alerta [mensaje]="error()" (cerrar)="error.set('')" />

@if (cargando()) { <p>Cargando...</p> }

@if (!cargando() && productos().length === 0 && !error()) {
  <p>No hay productos registrados.</p>
}

@if (productos().length > 0) {
  <table>
    <thead>
      <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      @for (p of productos(); track p.id) {
        <tr app-producto-fila [producto]="p" (eliminar)="eliminar($event)"></tr>
      }
    </tbody>
  </table>
}
