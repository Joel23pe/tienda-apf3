# Desarrollo: PostgreSQL local. Los valores pueden venir de variables de entorno;
# si no existen, usa la base local "tienda".
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tienda}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
# Valor por defecto solo para PostgreSQL local; define DB_PASSWORD con tu contraseña real
spring.datasource.password=${DB_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update

# Clave JWT en Base64 (mínimo 256 bits), solo para pruebas locales
app.jwt.secret=${JWT_SECRET:Y2xhdmVTZWNyZXRhU3VwZXJTZWd1cmFQYXJhTWlUaWVuZGFKd3QyMDI2TG9jYWwhIQ==}