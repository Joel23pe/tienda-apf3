<section class="formulario">
  <h2>{{ id ? 'Editar producto' : 'Nuevo producto' }}</h2>
  <form [formGroup]="form" (ngSubmit)="guardar()" novalidate>
    <label for="nombre">Nombre</label>
    <input id="nombre" formControlName="nombre" [class.invalido]="invalido('nombre')" />
    @if (invalido('nombre')) {
      <p class="error">El nombre es obligatorio (2 a 80 caracteres).</p>
    }

    <label for="precio">Precio</label>
    <input id="precio" type="number" step="0.01" formControlName="precio" [class.invalido]="invalido('precio')" />
    @if (invalido('precio')) {
      <p class="error">El precio debe ser mayor a 0.</p>
    }

    <label for="stock">Stock</label>
    <input id="stock" type="number" formControlName="stock" [class.invalido]="invalido('stock')" />
    @if (invalido('stock')) {
      <p class="error">El stock debe ser un entero mayor o igual a 0.</p>
    }

    <app-alerta [mensaje]="error()" (cerrar)="error.set('')" />

    <div class="botones">
      <button class="btn" type="submit" [disabled]="guardando()">
        {{ guardando() ? 'Guardando...' : 'Guardar' }}
      </button>
      <a class="btn sec" routerLink="/productos">Cancelar</a>
    </div>
  </form>
</section>
